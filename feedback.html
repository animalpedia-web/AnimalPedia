    <!-- =========================
         NỘI DUNG
    ========================== -->

    <main class="feedback-page">

        <section class="feedback-container">

            <div class="feedback-header">

                <span class="feedback-icon">
                    💬
                </span>

                <h1>
                    Góp ý cho AnimalPedia
                </h1>

                <p>
                    Ý kiến của bạn giúp AnimalPedia
                    ngày càng hoàn thiện hơn.
                </p>

            </div>


            <!-- FORM -->

            <form id="feedbackForm">


                <!-- TÊN -->

                <div class="form-group">

                    <label for="name">
                        Tên của bạn
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Nhập tên của bạn"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                        <span>(không bắt buộc)</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                    >

                </div>


                <!-- LOẠI GÓP Ý -->

                <div class="form-group">

                    <label for="category">
                        Loại góp ý
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            -- Chọn loại góp ý --
                        </option>

                        <option value="data">
                            Thông tin động vật
                        </option>

                        <option value="error">
                            Báo lỗi
                        </option>

                        <option value="suggestion">
                            Đề xuất tính năng
                        </option>

                        <option value="design">
                            Giao diện
                        </option>

                        <option value="other">
                            Khác
                        </option>

                    </select>

                </div>


                <!-- NỘI DUNG -->

                <div class="form-group">

                    <label for="message">
                        Nội dung góp ý
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        placeholder="Hãy cho chúng tôi biết ý kiến của bạn..."
                        required
                    ></textarea>

                </div>


                <!-- NÚT GỬI -->

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Gửi góp ý
                </button>


                <!-- THÔNG BÁO -->

                <div
                    id="feedbackMessage"
                    class="feedback-message"
                ></div>

            </form>

        </section>

    </main>


    <script type="module" src="js/feedback.js"></script>

</body>
</html>
